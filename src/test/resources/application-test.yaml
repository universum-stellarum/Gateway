spring:
  application:
    name: gateway
  cloud:
    config:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://development.universum.api.br

universum:
  services:
    storage:
      service: http://localhost:1
    notification:
      service: http://localhost:1
    finance:
      service: http://localhost:1

gateway:
  security:
    public-post-paths: /identity/api/v1/auth/login,/identity/api/v1/auth/refresh,/identity/api/v1/auth/logout
    jwt-audience: universum-api
  cors:
    allowed-origins: https://development.universum.api.br
