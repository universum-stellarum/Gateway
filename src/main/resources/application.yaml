server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: universum-polaris
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:${gateway.services.identity-url}/.well-known/jwks.json}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s

gateway:
  services:
    identity-url: ${IDENTITY_URL:http://antares:8080}
  security:
    public-post-paths: ${AUTH_PUBLIC_POST_PATHS:/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/logout}
