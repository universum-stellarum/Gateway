name: universum-gateway-${APP_ENV}

services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
    expose:
      - "8080"
    networks:
      - services
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  services:
    external: true
    name: universum-${APP_ENV}
