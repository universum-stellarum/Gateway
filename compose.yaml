name: universum-polaris-${APP_ENV:?Defina APP_ENV como dev ou prod}

services:
  polaris:
    build: .
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV:?Defina APP_ENV como dev ou prod}
      SERVER_PORT: ${SERVER_PORT:?Defina a porta interna do Polaris}
      IDENTITY_URL: ${IDENTITY_URL:?Defina a URL interna do Antares}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?Defina a URL das chaves publicas do Antares}
      AUTH_PUBLIC_POST_PATHS: ${AUTH_PUBLIC_POST_PATHS:?Defina os endpoints publicos de autenticacao}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina as origens do frontend}
    # Internal port only. Dokploy/Traefik handles the public domains and HTTPS.
    expose:
      - "${SERVER_PORT:?Defina a porta interna do Polaris}"
    networks:
      - services
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  # Create universum-dev and universum-prod once on the server. Each independent service
  # joins its environment's network; Antares must register the alias "antares".
  services:
    external: true
    name: universum-${APP_ENV:?Defina APP_ENV como dev ou prod}
