server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://production.coeur.app.br
          jwk-set-uri: http://identity:8080/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s

gateway:
  services:
    identity-url: http://identity:8080
    storage-url: http://storage:8080
    notification-url: http://notification:8080
    finance-url: http://finance:8080
  security:
    public-post-paths: /identity/api/v1/auth/login,/identity/api/v1/auth/refresh,/identity/api/v1/auth/logout
    jwt-audience: universum-api
  cors:
    allowed-origins: https://production.coeur.app.br
