server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://production.universum.api.br
          jwk-set-uri: ${universum.services.identity.service}/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s

gateway:
  security:
    public-post-paths: /identity/api/v1/auth/login,/identity/api/v1/auth/refresh,/identity/api/v1/auth/logout
    jwt-audience: universum-api
  cors:
    allowed-origins: https://production.universum.api.br
