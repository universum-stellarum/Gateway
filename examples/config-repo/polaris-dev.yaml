server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://development.coeur.app.br
          jwk-set-uri: http://antares:8080/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s

gateway:
  services:
    identity-url: http://antares:8080
  security:
    public-post-paths: /api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/logout
  cors:
    allowed-origins: https://development.coeur.app.br
