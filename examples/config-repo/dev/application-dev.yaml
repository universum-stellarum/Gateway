# Endereços dos microsserviços, sempre pela URI pública: toda chamada entre serviços passa pelo
# gateway (autenticação, logs, CORS). Os mesmos valores funcionam no servidor e na máquina local.
# Cada serviço fica sob o próprio prefixo; só o JWKS do identity fica na raiz (/.well-known/jwks.json).
universum:
  services:
    identity:
      url: "https://development.universum.api.br/identity"

    storage:
      url: "https://development.universum.api.br/storage"

    notification:
      url: "https://development.universum.api.br/notification"

    finance:
      url: "https://development.universum.api.br/finance"
