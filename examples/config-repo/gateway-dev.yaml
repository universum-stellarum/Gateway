server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://development.universum.api.br
          jwk-set-uri: ${gateway.routes.identity}/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s

gateway:
  # Destino de cada rota: alias do container na rede Docker do ambiente. Só o gateway usa esses
  # endereços; os serviços chamam uns aos outros por universum.services.*.url (URI pública).
  routes:
    identity: http://identity:8080
    storage: http://storage:8080
    notification: http://notification:8080
    finance: http://finance:8080
  security:
    public-post-paths: /identity/api/v1/auth/login,/identity/api/v1/auth/refresh,/identity/api/v1/auth/logout
    jwt-audience: universum-api
  cors:
    allowed-origins: https://development.universum.api.br
